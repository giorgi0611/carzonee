<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <header>
        <div class="left-side">
            <h1 style="font-style: italic;">CAR<span style="color: aqua;">ZONE</span></h1>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="favorites.html">Favorites (<span id="favorites-count">0</span>)</a></li>
                <li><a href="./cart.html" id="cart-toggle">cart(<span id="cart-count">0</span>)</a></li>
                <li><a href="./checkout.html">Checkout</a></li>
                <li><a href="./contact.html">Contact</a></li>
                <li><a href="./about.html">about</a></li>
                <li><a href="search.html">Search</a></li>
            </ul>
        </div>
        <div class="right-side">
            <div class="dark-light">
                <button onclick="showdark()" class=" switch dark" aria-label="Dark mode"><span class=" moon">☾</span></button>
                <button onclick="showlight()" class="switch light" aria-label="Light mode"><span class="sun">☀</span></button>
            </div>
        </div>
    </header>
    <div class="summaries" id="summaries">
        <div class="coupon">
            <h1>Discount code</h1>
            <input id="discount-code" type="text" placeholder="Enter a code for a 10% discount">
            <button id="apply-discount" type="button">Apply</button>
            <p id="discount-message"></p>
            <div class="summary-row">
                <span>Discount:</span>
                <span>-$<span id="cart-discount">0.00</span></span>
            </div>
        </div>
    <h2>Order Summary</h2>
    <div class="summary-row">
        <span>Cars Subtotal:</span>
        <span>$<span id="cart-subtotal">0.00</span></span>
    </div>
    <div class="summary-row">
        <span>Taxes (8%):</span>
        <span>$<span id="cart-tax">0.00</span></span>
    </div>
    <div class="summary-row">
        <span>Shipping:</span>
        <span>$<span id="cart-shipping">0.00</span></span>
    </div>
    <div class="summary-row final-total">
        <span>Total:</span>
        <span>$<span id="cart-total">0.00</span></span>
    </div>
    </div>
    <div id="cart-container" class="cars-container"></div>

      <p id="empty-message" hidden> You haven't added any cars to your cart yet.</p>



    <script src="./cart.js" defer></script>
</body>
</html>
